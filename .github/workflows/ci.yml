name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App - type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  edge-functions:
    name: Edge Functions - type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check --no-lock supabase/functions/*/index.ts supabase/functions/*/*_test.ts supabase/functions/*/adapters/*.ts
      - name: Unit tests (no network, no real SMS or payments)
        run: deno test --no-lock --allow-env supabase/functions/

  database:
    name: Database - RLS and integration tests (rolled back)
    runs-on: ubuntu-latest
    # Needs repository configuration, so it never runs for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # One run at a time against the project
    concurrency:
      group: database-tests
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Database tests skipped. Add the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_PROJECT_REF variable to run them."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.enabled == 'true'
        with:
          version: latest
      - name: Run database tests (new migrations applied inside each rolled-back transaction)
        if: steps.config.outputs.enabled == 'true'
        run: node supabase/tests/run.mjs --pending
